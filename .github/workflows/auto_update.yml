name: Auto Update Regulations

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (08:00, 14:00, 20:00, 02:00 Beijing time)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run auto-update check
        id: run_update
        run: |
          python scripts/auto_update.py
          # Check if index.html was modified
          if git diff --quiet index.html; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to index.html"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in index.html"
            # Show the diff summary
            git diff --stat index.html
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push changes
        if: steps.run_update.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/update_log.json
          COMMIT_MSG="🤖 Auto-update: new regulations detected - $(date +%Y-%m-%d)"
          git commit -m "$COMMIT_MSG" || echo "Commit failed, possibly empty"
          git push origin gh-pages || echo "Push failed"

      - name: Push update log even when no new regulations
        if: steps.run_update.outputs.has_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/update_log.json || true
          if ! git diff --cached --quiet; then
            COMMIT_MSG="🤖 Auto-update: checked, no new regulations - $(date +%Y-%m-%d)"
            git commit -m "$COMMIT_MSG"
            git push origin gh-pages || echo "Push failed"
          else
            echo "No changes to commit (update_log unchanged)"
          fi

      - name: Check for notification file (needs manual review)
        id: check_notification
        run: |
          if [ -f "new_regulations.json" ]; then
            echo "needs_review=true" >> $GITHUB_OUTPUT
            cat new_regulations.json
          else
            echo "needs_review=false" >> $GITHUB_OUTPUT
            echo "No regulations needing manual review"
          fi

      - name: Create GitHub Issue for regulations needing review
        if: steps.check_notification.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check existing open issues to avoid duplicates
          EXISTING_ISSUES=$(gh issue list --state open --label auto-detected --limit 50 2>/dev/null || echo "")
          EXISTING_COUNT=$(echo "$EXISTING_ISSUES" | grep -c "New Regulations" || echo "0")
          
          if [ "$EXISTING_COUNT" -gt 5 ]; then
            echo "⚠️ Already $EXISTING_COUNT open auto-detected issues — skipping to avoid accumulation"
            echo "Please review and close existing issues before new ones are created."
            exit 0
          fi
          
          # Read the notification data
          TITLE="🆕 New Regulations Detected - $(date +%Y-%m-%d)"
          BODY=$(python3 -c "
          import json
          with open('new_regulations.json', 'r') as f:
              data = json.load(f)
          lines = ['## New Regulations Detected', '']
          lines.append(f'**Check Time:** {data[\"timestamp\"]}')
          lines.append('')
          lines.append('The following new regulations were detected from official sources:')
          lines.append('')
          for reg in data['regulations_needing_review']:
              lines.append(f'### {reg.get(\"numberCN\", \"Unknown\")}')
              lines.append(f'- **Source:** {reg.get(\"source\", reg.get(\"url\", \"\"))}')
              lines.append(f'- **URL:** [{reg[\"url\"]}]({reg[\"url\"]})')
              lines.append('')
          lines.append('---')
          lines.append('')
          lines.append('💡 These entries have been added to the tracker with `status: pending`.')
          lines.append('Run the Skill locally to verify and complete them.')
          print('\\n'.join(lines))
          ")
          
          # Create issue with auto-detected label
          echo "$BODY" | gh issue create \
            --title "$TITLE" \
            --label "auto-detected" \
            --body-file - || true

      - name: Cleanup
        if: always()
        run: |
          rm -f new_regulations.json
