name: Auto Update Regulations

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (08:00, 14:00, 20:00, 02:00 Beijing time)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run auto-update check
        id: run_update
        run: |
          python scripts/auto_update.py
          # Check if index.html was modified
          if git diff --quiet index.html; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to index.html"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in index.html"
            # Show the diff summary
            git diff --stat index.html
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push changes
        if: steps.run_update.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          COMMIT_MSG="🤖 Auto-update: new regulations detected - $(date +%Y-%m-%d)"
          git commit -m "$COMMIT_MSG" || echo "Commit failed, possibly empty"
          git push origin gh-pages || echo "Push failed"

      - name: Check for notification file (needs manual review)
        id: check_notification
        run: |
          if [ -f "new_regulations.json" ]; then
            echo "needs_review=true" >> $GITHUB_OUTPUT
            cat new_regulations.json
          else
            echo "needs_review=false" >> $GITHUB_OUTPUT
            echo "No regulations needing manual review"
          fi

      - name: Create GitHub Issue for regulations needing review
        if: steps.check_notification.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the notification data
          TITLE="⚠️ Regulations Needing Manual Review - $(date +%Y-%m-%d)"
          BODY=$(python3 -c "
          import json
          with open('new_regulations.json', 'r') as f:
              data = json.load(f)
          lines = ['## Regulations Needing Manual Review', '']
          lines.append(f'**Check Time:** {data[\"timestamp\"]}')
          lines.append(f'**Total New Regulations:** {data[\"total_new\"]}')
          lines.append(f'**Need Review:** {data[\"needs_review\"]}')
          lines.append('')
          lines.append('The following regulations were auto-detected but need manual verification:')
          lines.append('')
          for reg in data['regulations_needing_review']:
              lines.append(f'### {reg.get(\"numberCN\", \"Unknown\")}')
              lines.append(f'- **ID:** {reg.get(\"id\", \"Unknown\")}')
              lines.append(f'- **Title:** {reg.get(\"title\", \"Unknown\")}')
              lines.append(f'- **URL:** {reg[\"url\"]}')
              lines.append(f'- **Reason:** {reg.get(\"reason\", \"Needs verification\")}')
              lines.append('')
          lines.append('---')
          lines.append('')
          lines.append('💡 Run the `apac-trade-compliance-updater` Skill locally to verify and complete these entries.')
          lines.append('The entries have been added to the tracker with `status: pending` and placeholder descriptions.')
          print('\\n'.join(lines))
          ")
          
          # Create issue using GitHub CLI
          echo "$BODY" | gh issue create \
            --title "$TITLE" \
            --body-file - || true

      - name: Cleanup
        if: always()
        run: |
          rm -f new_regulations.json
